<div class="bubble-wrapper" [ngClass]="{ 'me': message.sent_by_me , 'them': !message.sent_by_me }" [class.read]="message.read" appInViewport (visible)="onVisibilityChanged($event)">
  <div class="bubble" [ngClass]="{ 'me': message.sent_by_me , 'them': !message.sent_by_me }" [class.read]="message.read">
    {{ message.message }}
  </div>
  <div class="timestamp">
    {{ message.send_ts| date:'MM/dd/yyyy HH:mm' }}
  </div>
</div>
