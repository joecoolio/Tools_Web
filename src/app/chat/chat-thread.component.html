<div class="thread-container" [class.collapsed]="collapsed">
    <div class="chat-header">
        <img [src]="chat?.neighbor?.imageUrl" alt="User Avatar" class="avatar" />
        <span class="chat-name">{{ chat?.neighbor?.name }}</span>
        <button class="collapse-btn" (click)="toggleCollapsed()">▲</button>
    </div>

    <div class="chat-body">
        <div #chatBody class="message-list">
            @for(msg of chat?.messages(); track msg.id) {
                <app-chat-bubble [message]="msg"></app-chat-bubble>
            }
        </div>

        <div class="chat-reply">
            <input type="text" [(ngModel)]="replyText" placeholder="Type your reply..." />
            <button (click)="sendReply()" [disabled]="!replyText.trim()">Send</button>
        </div>
    </div>
</div>
